name: TestFlight Notes Check

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight-notes:
    name: 'What to Test (iOS) required for main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check What to Test (iOS) section
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | ./client/scripts/extract-testflight-notes.sh
