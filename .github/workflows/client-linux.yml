name: Client Linux Checks

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-linux:
    name: Client Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install OCR and headless-capture system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libleptonica-dev libtesseract-dev libclang-dev clang xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            client -> target
            hash-server -> target

      - name: Rust format check (workspace)
        run: cargo fmt --all -- --check
        working-directory: client

      - name: Rust lint (core)
        run: cargo clippy -p virtue-core --all-targets -- -D warnings
        working-directory: client

      - name: Rust lint (Linux client)
        run: cargo clippy -p virtue-linux --all-targets -- -D warnings
        working-directory: client

      - name: Rust tests (core)
        run: cargo test -p virtue-core
        working-directory: client

      - name: Rust scenario tests (core)
        run: cargo test -p virtue-core --features testing --test scenarios
        working-directory: client

      - name: Rust tests (Linux client)
        run: cargo test -p virtue-linux
        working-directory: client

      - name: Build hash server
        run: cargo build
        working-directory: hash-server

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run device -> api/hash integration test
        run: bun client/linux/scripts/integration-test.ts

      # build-deb-docker.sh deliberately builds with its own CARGO_HOME and
      # target dir (client/.docker-cargo-home, client/target-docker) instead
      # of the host paths the "Cache Rust artifacts" step above manages —
      # artifacts built by the container's older glibc aren't compatible
      # with binaries linked against the host runner's glibc. That means
      # they need their own cache entry, or this step re-downloads and
      # recompiles the entire dependency tree (~370 crates) from scratch on
      # every run.
      - name: Cache Docker Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            client/.docker-cargo-home
            client/target-docker
          key: linux-deb-docker-v1-${{ hashFiles('client/Cargo.lock') }}
          restore-keys: |
            linux-deb-docker-v1-

      - name: Build Linux .deb package
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/staging" ) ]]; then
            ./linux/scripts/build-deb-docker.sh
          else
            ./linux/scripts/build-deb-docker.sh --debug
          fi
        working-directory: client

      - name: Resolve version info
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        id: version
        shell: bash
        run: |
          source ./scripts/version.sh
          echo "release_tag=$(virtue_release_tag)" >> "$GITHUB_OUTPUT"
          echo "build_label=$(virtue_build_label)" >> "$GITHUB_OUTPUT"
          echo "arch=$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
        working-directory: client

      - name: Upload Linux installer artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: virtue-linux-${{ steps.version.outputs.build_label }}
          path: client/target-docker/debian/virtue-linux_${{ steps.version.outputs.build_label }}_${{ steps.version.outputs.arch }}.deb

      - name: Clear existing Linux release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue-linux_*.deb"
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue_*.deb"
        working-directory: client

      - name: Publish Linux release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ steps.version.outputs.release_tag }}" "${{ steps.version.outputs.build_label }}" "target-docker/debian/virtue-linux_${{ steps.version.outputs.build_label }}_${{ steps.version.outputs.arch }}.deb" "${{ github.ref_name == 'main' && 'stable' || 'dev' }}"
        working-directory: client
