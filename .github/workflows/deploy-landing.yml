name: Deploy Landing

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v4

      - name: Get main branch SHA
        id: main-sha
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main --depth=1
          echo "sha=$(git rev-parse origin/main)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm run ${{ github.ref_name == 'main' && 'deploy:prod' || 'deploy:staging' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.main-sha.outputs.sha }}
          VIRTUE_REQUIRE_RELEASE_SYNC: ${{ (github.ref_name == 'main' || github.ref_name == 'staging') && '1' || '' }}
          VIRTUE_RELEASE_SYNC_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || github.ref_name == 'staging' && 'prerelease' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
