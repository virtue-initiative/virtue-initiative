name: Client macOS Checks

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-macos:
    name: Client macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          cache-on-failure: true
          workspaces: |
            client -> target
            hash-server -> target

      - name: Determine build profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/staging" ) ]]; then
            echo "cargo_release_flag=--release" >> "$GITHUB_OUTPUT"
            echo "mac_dmg_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_release_flag=" >> "$GITHUB_OUTPUT"
            echo "mac_dmg_flags=--profile debug --arch arm64" >> "$GITHUB_OUTPUT"
          fi

      # Lint/test against the same --target aarch64-apple-darwin profile that
      # "Build macOS universal app bundle and DMG" below uses for its arm64
      # slice (release on push to main/staging, debug otherwise), instead of
      # the default (dev profile, implicit host target) cargo uses without
      # these flags. Cargo keys its build cache on the exact (profile,
      # target, features) tuple, so a mismatch there means every dependency
      # gets recompiled from scratch per step; matching it here means
      # lint/test warm the same target/aarch64-apple-darwin/<profile> cache
      # that build-app.sh's own arm64 build then reuses.
      - name: Build aarch64 artifacts
        run: cargo build ${{ steps.profile.outputs.cargo_release_flag }} --target aarch64-apple-darwin -p virtue-mac -p virtue-mac-ffi
        working-directory: client

      - name: Rust lint (core)
        run: cargo clippy ${{ steps.profile.outputs.cargo_release_flag }} --target aarch64-apple-darwin -p virtue-core --all-targets -- -D warnings
        working-directory: client

      - name: Rust lint (macOS client)
        run: cargo clippy ${{ steps.profile.outputs.cargo_release_flag }} --target aarch64-apple-darwin -p virtue-mac --all-targets -- -D warnings
        working-directory: client

      - name: Rust tests (core)
        run: cargo test ${{ steps.profile.outputs.cargo_release_flag }} --target aarch64-apple-darwin -p virtue-core
        working-directory: client

      - name: Rust scenario tests (core)
        run: cargo test ${{ steps.profile.outputs.cargo_release_flag }} --target aarch64-apple-darwin -p virtue-core --features testing --test scenarios
        working-directory: client

      - name: Build hash server
        run: cargo build
        working-directory: hash-server

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run device -> api/hash integration test
        run: bun client/mac/scripts/integration-test.ts

      - name: Add Intel cross-compilation target
        run: rustup target add x86_64-apple-darwin

      # Release builds (push to main/staging) sign with the real Developer ID
      # Application identity and notarize, so downloaded DMGs open with no
      # Gatekeeper block. PR builds and forks (no access to the cert secret)
      # fall back to ad-hoc signing/no notarization automatically, since the
      # `if:` guards below are false and CODESIGN_IDENTITY/DEVELOPMENT_TEAM
      # stay at their ad-hoc defaults.
      - name: Import signing certificate into CI keychain
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        env:
          MACOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DIST_CERTIFICATE_P12_BASE64 }}
          MACOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # The `secrets` context can't be referenced in a step `if:`, so the
          # "is the cert secret set yet" check has to live here instead.
          if [[ -z "$MACOS_DIST_CERTIFICATE_P12_BASE64" ]]; then
            echo "MACOS_DIST_CERTIFICATE_P12_BASE64 not set; skipping cert import (ad-hoc signing fallback)."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/virtue-macos-ci.keychain-db"
          CERT_PATH="$RUNNER_TEMP/virtue-macos-dist.p12"

          echo "$MACOS_DIST_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/"//g')"
          # Intentionally unquoted: security expects each existing keychain
          # path as a separate argument, not one combined string.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "MACOS_SIGNING_READY=1" >> "$GITHUB_ENV"

      - name: Prepare notarization API key
        if: env.MACOS_SIGNING_READY == '1'
        env:
          IOS_ASC_API_KEY_P8_BASE64: ${{ secrets.IOS_ASC_API_KEY_P8_BASE64 }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
        run: |
          set -euo pipefail
          ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          echo "$IOS_ASC_API_KEY_P8_BASE64" | base64 --decode > "$ASC_API_KEY_PATH"
          echo "ASC_API_KEY_PATH=$ASC_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build macOS universal app bundle and DMG
        run: ./mac/scripts/build-dmg.sh ${{ steps.profile.outputs.mac_dmg_flags }}
        working-directory: client
        env:
          # Bakes the Sparkle feed URL + public key into the app. Gated on
          # MACOS_SIGNING_READY, not just the branch: Sparkle refuses an update
          # that isn't signed by the same Developer ID as the running app, so
          # enabling auto-update on an ad-hoc-signed build would ship an
          # updater that can never successfully install anything.
          VIRTUE_ENABLE_AUTO_UPDATE: ${{ env.MACOS_SIGNING_READY == '1' && '1' || '' }}
          # Falls back to ad-hoc signing (CI has no access to a real Developer
          # ID identity) unless the import step above ran and set these.
          CODESIGN_IDENTITY: ${{ env.MACOS_SIGNING_READY == '1' && 'Developer ID Application' || '-' }}
          DEVELOPMENT_TEAM: ${{ env.MACOS_SIGNING_READY == '1' && secrets.IOS_TEAM_ID || '' }}
          ASC_KEY_ID: ${{ env.MACOS_SIGNING_READY == '1' && secrets.IOS_ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ env.MACOS_SIGNING_READY == '1' && secrets.IOS_ASC_ISSUER_ID || '' }}
          # ASC_API_KEY_PATH comes from the "Prepare notarization API key" step via GITHUB_ENV

      - name: Clean up CI keychain
        if: always() && env.MACOS_SIGNING_READY == '1'
        run: |
          security delete-keychain "$RUNNER_TEMP/virtue-macos-ci.keychain-db" || true
          rm -f "${ASC_API_KEY_PATH:-}"

      - name: Resolve version info
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        id: version
        shell: bash
        run: |
          source ./scripts/version.sh
          echo "release_tag=$(virtue_release_tag)" >> "$GITHUB_OUTPUT"
          echo "build_label=$(virtue_build_label)" >> "$GITHUB_OUTPUT"
        working-directory: client

      - name: Upload macOS installer artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: virtue-macos-${{ steps.version.outputs.build_label }}
          path: client/target/macos/virtue-macos-${{ steps.version.outputs.build_label }}.dmg

      - name: Clear existing macOS release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue-macos-*.dmg"
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "Virtue-*.dmg"
        working-directory: client

      # The appcast <item> must be produced here, on the macOS runner: sign_update
      # is a macOS binary, and this keeps the release key off every other job.
      # The landing site assembles these fragments into the served feed.
      - name: Build signed appcast item
        if: env.MACOS_SIGNING_READY == '1'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not set; cannot publish an appcast item." >&2
            exit 1
          fi
          ./mac/scripts/make-appcast-item.sh \
            "target/macos/virtue-macos-${{ steps.version.outputs.build_label }}.dmg" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.release_tag }}/virtue-macos-${{ steps.version.outputs.build_label }}.dmg" \
            "${{ github.ref_name == 'main' && 'stable' || 'dev' }}" \
            "target/macos/appcast-item-macos.xml"
        working-directory: client

      - name: Publish macOS release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ steps.version.outputs.release_tag }}" "${{ steps.version.outputs.build_label }}" "target/macos/virtue-macos-${{ steps.version.outputs.build_label }}.dmg" "${{ github.ref_name == 'main' && 'stable' || 'dev' }}"
        working-directory: client

      # Uploaded after the DMG so the feed can never advertise an enclosure URL
      # that isn't downloadable yet.
      - name: Publish appcast item asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && env.MACOS_SIGNING_READY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.release_tag }}" "target/macos/appcast-item-macos.xml" --clobber -R "${{ github.repository }}"
        working-directory: client
