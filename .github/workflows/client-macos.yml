name: Client macOS Checks

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-macos:
    name: Client macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          cache-on-failure: true
          workspaces: |
            client -> target

      - name: Rust build smoke test (core)
        run: cargo build -p virtue-core
        working-directory: client

      - name: Rust build smoke test (macOS client)
        run: cargo build -p virtue-mac
        working-directory: client

      - name: Rust lint (core)
        run: cargo clippy -p virtue-core --all-targets -- -D warnings
        working-directory: client

      - name: Rust lint (macOS client)
        run: cargo clippy -p virtue-mac --all-targets -- -D warnings
        working-directory: client

      - name: Rust tests (core)
        run: cargo test -p virtue-core
        working-directory: client

      - name: Rust scenario tests (core)
        run: cargo test -p virtue-core --features testing --test scenarios
        working-directory: client

      - name: Add Intel cross-compilation target
        run: rustup target add x86_64-apple-darwin

      - name: Build macOS universal app bundle and DMG
        run: ./mac/scripts/build-dmg.sh
        working-directory: client
        env:
          # CI has no access to a real Developer ID identity; build-app.sh
          # otherwise now defaults to one for local dev (see its comments).
          CODESIGN_IDENTITY: '-'
          DEVELOPMENT_TEAM: ''

      - name: Resolve version info
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        id: version
        shell: bash
        run: |
          source ./scripts/version.sh
          echo "release_tag=$(virtue_release_tag)" >> "$GITHUB_OUTPUT"
          echo "build_label=$(virtue_build_label)" >> "$GITHUB_OUTPUT"
        working-directory: client

      - name: Upload macOS installer artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: virtue-macos-${{ steps.version.outputs.build_label }}
          path: client/target/macos/virtue-macos-${{ steps.version.outputs.build_label }}.dmg

      - name: Clear existing macOS release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue-macos-*.dmg"
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "Virtue-*.dmg"
        working-directory: client

      - name: Publish macOS release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ steps.version.outputs.release_tag }}" "${{ steps.version.outputs.build_label }}" "target/macos/virtue-macos-${{ steps.version.outputs.build_label }}.dmg" "${{ github.ref_name == 'main' && 'stable' || 'dev' }}"
        working-directory: client

  client-macos-integration:
    name: Client macOS Integration
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          cache-on-failure: true
          workspaces: |
            client -> target
            hash-server -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run device -> api/hash integration test
        run: bun client/mac/scripts/integration-test.ts
