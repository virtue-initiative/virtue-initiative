name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [web, api]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project }}/package-lock.json
            ${{ matrix.project == 'web' && 'shared-web/package-lock.json' || '' }}

      - name: Install shared-web dependencies
        if: matrix.project == 'web'
        run: npm ci
        working-directory: shared-web

      - run: npm ci
      - run: npm run ${{ github.ref_name == 'main' && 'deploy:prod' || 'deploy:staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
