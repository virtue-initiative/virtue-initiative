name: Web Checks

on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: API Prettier check
        run: bun run format:check
        working-directory: api

      - name: Web Prettier check
        run: bun run format:check
        working-directory: web

      - name: Landing Prettier check
        run: bun run format:check
        working-directory: landing

      - name: Shared Web Prettier check
        run: bun run format:check
        working-directory: shared-web

      - name: API type check
        run: bun run typecheck
        working-directory: api

      - name: API tests
        run: bun run test
        working-directory: api

      - name: Web type check
        run: bun run typecheck
        working-directory: web

      - name: Web tests
        run: bun run test
        working-directory: web

      - name: Landing type check
        run: bun run typecheck
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Web build
        run: bun run build
        working-directory: web

      - name: Landing build
        run: bun run build
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
