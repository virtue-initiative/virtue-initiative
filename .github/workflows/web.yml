name: Web Checks

on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API Prettier check
        run: npm run format:check
        working-directory: api

      - name: Web Prettier check
        run: npm run format:check
        working-directory: web

      - name: Landing Prettier check
        run: npm run format:check
        working-directory: landing

      - name: Shared Web Prettier check
        run: npm run format:check
        working-directory: shared-web

      - name: API type check
        run: npm run typecheck
        working-directory: api

      - name: API tests
        run: npm test
        working-directory: api

      - name: Web type check
        run: npm run typecheck
        working-directory: web

      - name: Landing type check
        run: npm run typecheck
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Web build
        run: npm run build
        working-directory: web

      - name: Landing build
        run: npm run build
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
