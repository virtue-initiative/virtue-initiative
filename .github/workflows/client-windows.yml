name: Client Windows Checks

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-windows:
    name: Client Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-explicit-target-v1
          cache-on-failure: true
          workspaces: |
            client -> target
            hash-server -> target

      - name: Determine build profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/staging" ) ]]; then
            echo "cargo_release_flag=--release" >> "$GITHUB_OUTPUT"
            echo "dotnet_config=Release" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_release_flag=" >> "$GITHUB_OUTPUT"
            echo "dotnet_config=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust lint (core)
        run: cargo clippy --target x86_64-pc-windows-msvc ${{ steps.profile.outputs.cargo_release_flag }} -p virtue-core --all-targets -- -D warnings
        working-directory: client

      - name: Rust lint (Windows client)
        run: cargo clippy --target x86_64-pc-windows-msvc ${{ steps.profile.outputs.cargo_release_flag }} -p virtue-windows --all-targets -- -D warnings
        working-directory: client

      - name: Rust tests (core)
        run: cargo test --target x86_64-pc-windows-msvc ${{ steps.profile.outputs.cargo_release_flag }} -p virtue-core
        working-directory: client

      - name: Rust scenario tests (core)
        run: cargo test --target x86_64-pc-windows-msvc ${{ steps.profile.outputs.cargo_release_flag }} -p virtue-core --features testing --test scenarios
        working-directory: client

      - name: Rust tests (Windows client)
        run: cargo test --target x86_64-pc-windows-msvc ${{ steps.profile.outputs.cargo_release_flag }} -p virtue-windows
        working-directory: client

      - name: Build hash server
        run: cargo build
        working-directory: hash-server

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run device -> api/hash integration test
        run: bun client/windows/scripts/integration-test.ts

      - name: Test WinUI core library
        run: dotnet test ./windows/Virtue.WindowsApp.Tests/Virtue.WindowsApp.Tests.csproj -c ${{ steps.profile.outputs.dotnet_config }}
        working-directory: client

      - name: Build Windows MSIX (debug)
        if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging')
        run: ./windows/scripts/build-msix.ps1 -Profile Debug -SkipTests
        working-directory: client

      - name: Resolve version info
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        id: version
        shell: pwsh
        working-directory: client/windows
        run: |
          . ./scripts/Get-VersionInfo.ps1
          $info = Get-VirtueVersionInfo
          "release_tag=$($info.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "build_label=$($info.BuildLabel)" >> $env:GITHUB_OUTPUT

      - name: Build Windows MSIX (release)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: ./windows/scripts/build-msix.ps1 -Profile Release -Version "${{ steps.version.outputs.build_label }}" -SkipTests
        working-directory: client

      - name: Repack Windows setup bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.build_label }}"
          $distDir = Join-Path $PWD "windows\dist"
          $bundleDir = Join-Path $distDir "virtue-windows-$version-setup"
          $bundleZip = Join-Path $distDir "virtue-windows-$version-setup.zip"

          if (-not (Test-Path $bundleDir)) {
            throw "Setup bundle directory not found at $bundleDir"
          }

          if (Test-Path $bundleZip) {
            Remove-Item -Force $bundleZip
          }

          Compress-Archive -Path $bundleDir -DestinationPath $bundleZip -Force
        working-directory: client

      - name: Upload Windows MSIX artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: virtue-windows-${{ steps.version.outputs.build_label }}
          path: |
            client/windows/dist/virtue-windows-${{ steps.version.outputs.build_label }}.msix
            client/windows/dist/virtue-windows-${{ steps.version.outputs.build_label }}-setup.zip

      - name: Clear existing Windows release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue-windows-*.msix"
          ./scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "virtue-windows-*-setup.zip"
        working-directory: client

      - name: Publish Windows setup bundle asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ steps.version.outputs.release_tag }}" "${{ steps.version.outputs.build_label }}" "windows/dist/virtue-windows-${{ steps.version.outputs.build_label }}-setup.zip" "${{ github.ref_name == 'main' && 'stable' || 'dev' }}"
        working-directory: client

      - name: Submit Windows MSIX to Store Staging flight
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ vars.WINSTORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.WINSTORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.WINSTORE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ vars.WINSTORE_APP_ID }}
          STORE_FLIGHT_ID: ${{ vars.WINSTORE_FLIGHT_ID }}
        run: ./windows/scripts/submit-store-flight.ps1 -PackagePath "windows/dist/virtue-windows-${{ steps.version.outputs.build_label }}.msix"
        working-directory: client

      # The main listing, not a flight: this is the submission Store customers
      # install and auto-update from. Package version comes out of
      # build-msix.ps1 as <VERSION>.0 on main (vs. <major>.<minor>.<run>.0 for
      # dev builds), so it stays distinct from every flight package and the
      # flight stays ahead of the listing as Microsoft's model expects.
      - name: Submit Windows MSIX to Store main app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ vars.WINSTORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.WINSTORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.WINSTORE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ vars.WINSTORE_APP_ID }}
        run: ./windows/scripts/submit-store-app.ps1 -PackagePath "windows/dist/virtue-windows-${{ steps.version.outputs.build_label }}.msix"
        working-directory: client
