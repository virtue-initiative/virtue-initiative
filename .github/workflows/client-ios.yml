name: Client iOS Checks

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-ios:
    name: Client iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          cache-on-failure: true
          workspaces: |
            client -> target

      - name: Resolve version info
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        id: version
        shell: bash
        run: |
          source ./scripts/version.sh
          echo "release_tag=$(virtue_release_tag)" >> "$GITHUB_OUTPUT"
          echo "build_label=$(virtue_build_label)" >> "$GITHUB_OUTPUT"
        working-directory: client

      - name: Rust lint (iOS client)
        run: cargo clippy -p virtue-ios --all-targets -- -D warnings
        working-directory: client

      - name: Determine build configuration
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/staging" ) ]]; then
            echo "xcode_configuration_flag=--configuration Release" >> "$GITHUB_OUTPUT"
          else
            echo "xcode_configuration_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS app bundle (unsigned)
        run: ./scripts/build-ios.sh --destination "generic/platform=iOS" ${{ steps.profile.outputs.xcode_configuration_flag }} --derived-data .derived-data-ci-ios --code-signing-allowed NO
        working-directory: client/ios

      - name: Package iOS app bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        run: |
          mkdir -p dist
          app_path=".derived-data-ci-ios/Build/Products/Release-iphoneos/VirtueIOS.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "Built iOS app bundle not found: ${app_path}" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" "dist/VirtueIOS-${{ steps.version.outputs.build_label }}.zip"
        working-directory: client/ios

      - name: Upload iOS app bundle artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: virtue-ios-${{ steps.version.outputs.build_label }}
          path: client/ios/dist/VirtueIOS-${{ steps.version.outputs.build_label }}.zip

      - name: Clear existing iOS release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../scripts/clear-prerelease-assets.sh "${{ steps.version.outputs.release_tag }}" "VirtueIOS-*.zip"
        working-directory: client/ios

      - name: Publish iOS release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../scripts/publish-release.sh "${{ steps.version.outputs.release_tag }}" "${{ steps.version.outputs.build_label }}" "dist/VirtueIOS-${{ steps.version.outputs.build_label }}.zip" "${{ github.ref_name == 'main' && 'stable' || 'dev' }}"
        working-directory: client/ios

      - name: Import signing certificate into CI keychain
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        env:
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/virtue-ios-ci.keychain-db"
          CERT_PATH="$RUNNER_TEMP/virtue-ios-dist.p12"

          echo "$IOS_DIST_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      # Node (not bun) because this needs ES256 JWT signing for App Store
      # Connect, and node:crypto's ieee-p1363 dsaEncoding is the one stdlib
      # call that produces the raw r||s signature JWT requires.
      - name: Setup Node
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Archive and upload to TestFlight
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_API_KEY_P8_BASE64: ${{ secrets.IOS_ASC_API_KEY_P8_BASE64 }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          IOS_ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          echo "$IOS_ASC_API_KEY_P8_BASE64" | base64 --decode > "$IOS_ASC_API_KEY_PATH"
          export IOS_ASC_API_KEY_PATH

          IOS_APP_PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/virtue-ios-app-store.mobileprovision"
          IOS_EXT_PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/virtue-ios-safari-ext-app-store.mobileprovision"
          echo "$IOS_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$IOS_APP_PROVISIONING_PROFILE_PATH"
          echo "$IOS_EXT_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$IOS_EXT_PROVISIONING_PROFILE_PATH"
          export IOS_APP_PROVISIONING_PROFILE_PATH IOS_EXT_PROVISIONING_PROFILE_PATH

          ./scripts/build-and-upload-testflight.sh

          # The .p8 is deliberately left in place for the distribution step
          # below, which needs the same key to call the App Store Connect API.
          # The "Clean up CI keychain" step removes it, and runs even on failure.
          rm -f "$IOS_APP_PROVISIONING_PROFILE_PATH" "$IOS_EXT_PROVISIONING_PROFILE_PATH"
        working-directory: client/ios

      # Uploading only parks the build in App Store Connect: it processes for
      # several minutes and then belongs to no group. This is what waits for
      # that and actually distributes it. `main` always targets the external
      # public beta; on staging it is opt-in (see the group-name check below).
      - name: Distribute build to TestFlight group
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_BETA_GROUP_NAME: ${{ github.ref_name == 'main' && 'Virtue Initiative iOS Public Beta' || vars.IOS_STAGING_BETA_GROUP_NAME }}
          IOS_APP_ENCRYPTION_DECLARATION_ID: ${{ vars.IOS_APP_ENCRYPTION_DECLARATION_ID }}
          # A stable build points at https://api.virtueinitiative.org while a
          # dev build points at staging (client/core/build.rs bakes the URL in
          # per release channel), so a `main` build must not reach the staging
          # testers' group — it would move them onto production data. Enforced
          # only on main: staging builds reaching extra groups is harmless.
          IOS_EXCLUSIVE_BETA_GROUP: ${{ github.ref_name == 'main' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # `main` always has a group name (literal above), so this can only be
          # empty on staging, where automatic distribution is opt-in: staging
          # distributed through App Store Connect's own settings before this
          # step existed, and failing the job would regress that. Set the
          # IOS_STAGING_BETA_GROUP_NAME repo variable to opt staging in.
          if [[ -z "${IOS_BETA_GROUP_NAME:-}" ]]; then
            echo "No IOS_STAGING_BETA_GROUP_NAME repo variable set; leaving ${GITHUB_REF_NAME} distribution to App Store Connect."
            exit 0
          fi
          export IOS_ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          # IOS_MARKETING_VERSION / IOS_BUILD_VERSION / IOS_WHATS_NEW come from
          # build-and-upload-testflight.sh via GITHUB_ENV.
          node ./scripts/distribute-testflight-build.mjs
        working-directory: client/ios

      - name: Clean up CI keychain
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/virtue-ios-ci.keychain-db" || true
          # Both copies of the App Store Connect private key: the one the
          # archive step decoded, and the one build-and-upload-testflight.sh
          # places where altool insists on finding it.
          rm -f "$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8"
