name: Spec Check

# Every test cites a SPEC.md section, and uncovered sections only shrink.
# See TESTING.md.

on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-check:
    name: Spec check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check spec IDs in tests
        run: bun scripts/spec-check.ts

      - name: Check the deploy secrets list against what Workers use
        run: bun scripts/check-deploy-secrets.ts --check-usage

      - name: Coverage report
        if: always()
        run: bun scripts/spec-check.ts --report >> "$GITHUB_STEP_SUMMARY"
