[package]
name = "virtue-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
virtue_core = { package = "virtue-core", path = "../../core" }
virtue_text_detection = { package = "virtue-text-detection", path = "../../text-detection" }
jni = "0.22"
once_cell = "1"
# Must match the version ureq pulls in, so `android::init_with_env` below
# initializes the same instance rustls ends up using.
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
