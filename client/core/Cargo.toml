[package]
name = "virtue-core"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the `testing` module (MockClock, TestPlatformHooks, MockApiClient,
# Scenario) so platform crates and integration tests can drive MonitorService
# without real HTTP, screenshots, or wall-clock time. Automatically enabled
# for in-crate `cargo test` via cfg(test). Integration tests under tests/
# require the feature to be passed explicitly via `--features testing`.
testing = []

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
required-features = ["testing"]

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.1"
hex = "0.4"
hkdf = "0.12.4"
hpke = "0.13.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pbkdf2 = "0.12"
rand_core = { version = "0.9.5", features = ["os_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls-native-roots"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["time"] }
tract-onnx = "0.21"
tracing = "0.1"
virtue-text-detection = { path = "../text-detection" }
webp = "0.3"
