[package]
name = "virtue-core"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the `testing` module (MockClock, TestPlatformHooks, MockApiClient,
# Scenario) so platform crates and integration tests can drive MonitorService
# without real HTTP, screenshots, or wall-clock time. Automatically enabled
# for in-crate `cargo test` via cfg(test). Integration tests under tests/
# require the feature to be passed explicitly via `--features testing`.
testing = []

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
required-features = ["testing"]

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Only used by examples/onnx_to_nnef.rs and examples/compare_onnx_nnef.rs (offline
# ONNX→NNEF conversion tooling for the NSFW model — see risk_classifier.rs) — not part of
# the shipped runtime, which loads the pre-converted NNEF file via tract-nnef instead.
[dev-dependencies]
tract-onnx = "0.21"

# `serde_bytes` is only ever named inside `#[serde(with = "serde_bytes")]`
# attributes, which cargo-machete's source scan can't see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.23"
flate2 = "1.1"
# Cross-process advisory locking for `state.rs`'s sibling `.lock` file — see
# CORE-016. `flock`-backed on every Unix target we ship (incl. iOS/Android),
# `LockFileEx`-backed on Windows.
fs2 = "0.4"
hkdf = "0.12.4"
hpke = "0.13.0"
# Every platform's `take_screenshot` returns PNG (`content_type: "image/png"`),
# so PNG is the only decoder needed. WebP is encoded via the `webp` crate.
image = { version = "0.25", default-features = false, features = ["png"] }
rand_core = { version = "0.9.5", features = ["os_rng"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tract-nnef = "0.21"
tracing = "0.1"
# Genuinely blocking HTTP. `rustls` pulls the ring-backed rustls stack;
# `cookies` is required by API-001, which asks clients to retain the
# server's short-lived JWT access cookie. `platform-verifier` verifies
# certificates against the OS trust store, used on every platform except
# Android; `rustls-webpki-roots` backs Android instead (bundled Mozilla
# roots), since the platform-verifier crate's Kotlin half pulls in JNI/Gradle
# plumbing that isn't worth it there. See `HttpApiClient::new` in `src/api.rs`.
ureq = { version = "3.4", default-features = false, features = ["cookies", "json", "platform-verifier", "rustls", "rustls-webpki-roots"] }
virtue-text-detection = { path = "../text-detection" }
webp = "0.3"
