[package]
name = "virtue-mac-ffi"
version = "0.0.8"
edition = "2024"
description = "Thin FFI bridge from the Virtue macOS SwiftUI app to the shared Rust core"

[lib]
name = "virtue_mac_rust"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
virtue_core = { package = "virtue-core", path = "../../core" }
virtue_mac_platform = { package = "virtue-mac", path = ".." }
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1"
serde_json = "1"
