[package]
name = "virtue-mac"
version = "0.1.0"
edition = "2024"
description = "Virtue macOS background monitoring daemon"

[lib]
name = "virtue_mac"
path = "src/lib.rs"

[[bin]]
name = "virtue-mac"
path = "src/main.rs"

[[bin]]
name = "virtue-mac-ci-login"
path = "src/bin/ci-login.rs"

[features]
# CI-only: replaces real screen capture with a fixed embedded PNG, compiled in
# only when explicitly requested. Never enabled by build-app.sh/build-dmg.sh
# (release builds), so it cannot ship. See capture.rs.
mock-capture = []

[dependencies]
anyhow = "1"
virtue_core = { package = "virtue-core", path = "../core" }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGSession"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
