[package]
name = "virtue-mac"
version = "0.0.8"
edition = "2024"
description = "Virtue macOS background monitoring daemon"

[lib]
name = "virtue_mac"
path = "src/lib.rs"

[[bin]]
name = "virtue-mac"
path = "src/main.rs"

[dependencies]
anyhow = "1"
virtue_core = { package = "virtue-core", path = "../core" }
block2 = "0.6"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGSession"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
