[package]
name = "virtue-text-detection"
version = "0.0.1"
edition = "2024"
description = "Platform-agnostic OCR over captured screenshots"

[[bin]]
name = "ocr"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
leptess = "0.14"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSError", "NSString"] }
objc2-vision = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Globalization",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
