repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, json, css, scss, html, markdown, yaml]
        exclude: '^client/'
        additional_dependencies:
          - prettier@3.8.1

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd client && cargo fmt'
        language: system
        types: [rust]
        pass_filenames: false
